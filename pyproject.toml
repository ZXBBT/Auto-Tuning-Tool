[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamis"
version = "0.0.1"
description = "Physics-informed ECU calibration analysis & optimization pipeline"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# Added when we need autodiff for calibration/optimization (M3+)
ml = ["torch>=2.1", "pydantic>=2.5"]
# HTTP API + web app backend (needs the ml extra too)
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
dev = ["pytest>=7.4", "ruff>=0.3", "mypy>=1.8", "httpx>=0.27"]

[project.scripts]
dynamis = "dynamis.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
